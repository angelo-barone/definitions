; Word of the Day: Rainmeter desktop widget.
; Reads words.json from GitHub, so new words show up without touching the PC.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Refresh word list now
ContextAction=[!CommandMeasure MeasureFetch "Update"]

[Metadata]
Name=Word of the Day
Information=Shows one word and its definition from words.json, cycling daily or weekly.
Version=1.1

[Variables]
DataURL=https://raw.githubusercontent.com/angelo-barone/definitions/main/words.json
Width=420
Pad=20
FontFace=Segoe UI
WordFont=Georgia
; Colors are overwritten by WordOfTheDay.lua to follow the Windows light/dark setting.
BgColor=28,28,30,235

; Windows app theme: 1 = light, 0 = dark.
[MeasureTheme]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
RegValue=AppsUseLightTheme

; Downloads words.json to DownloadFile\words.json every 30 minutes; the script reads that file.
[MeasureFetch]
Measure=WebParser
URL=#DataURL#
Download=1
DownloadFile=words.json
ForceReload=1
UpdateRate=1800

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#WordOfTheDay.lua

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#Width#,([MeterDefinition:Y]+[MeterDefinition:H]+#Pad#),14 | Fill Color #BgColor# | StrokeWidth 0
DynamicVariables=1

[MeterLabel]
Meter=String
X=#Pad#
Y=#Pad#
FontFace=#FontFace#
FontSize=8
FontWeight=600
AntiAlias=1
Text=WORD OF THE DAY

[MeterWord]
Meter=String
X=#Pad#
Y=6R
FontFace=#WordFont#
FontSize=22
StringStyle=Bold
AntiAlias=1
Text=Loading...

[MeterPos]
Meter=String
X=10R
; Sit on the same baseline as the word.
Y=([MeterWord:Y]+[MeterWord:H]-[MeterPos:H]-4)
DynamicVariables=1
FontFace=#FontFace#
FontSize=11
StringStyle=Italic
AntiAlias=1
Text=

[MeterDefinition]
Meter=String
X=#Pad#
Y=8R
W=(#Width#-2*#Pad#)
ClipString=2
FontFace=#FontFace#
FontSize=12
AntiAlias=1
Text=
